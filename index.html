<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Dream Home</title>
    <style>
      :root {
        --sky1: #071a2d;
        --sky2: #153d5b;
        --sky3: #6ec6ff;
        --sun: #ffd166;
        --grass: #5cc27a;
        --dirt: #9d6b3f;
        --house: #f4d7b5;
        --house-dark: #e2b57d;
        --roof: #b7473a;
        --roof-dark: #7d2d27;
        --window: #fef4a5;
        --window-glow: rgba(255, 222, 104, 0.82);
        --tree: #2d7d52;
        --trunk: #6b422b;
        --cloud: rgba(255,255,255,0.8);
        --book1: #ff6b6b;
        --book2: #ffd166;
        --book3: #4ecdc4;
        --book4: #5f6fff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 35%, var(--sky3) 100%);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(1200px, 92vw);
        height: min(800px, 90vh);
        overflow: hidden;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(9,25,44,0.5), rgba(15,52,86,0.15));
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,0.8) 0 2px, transparent 2.5px),
          radial-gradient(circle, rgba(255,255,255,0.7) 0 1.5px, transparent 2px),
          radial-gradient(circle, rgba(255,255,255,0.9) 0 1.8px, transparent 2.5px);
        background-size: 220px 220px;
        background-position: 30px 30px, 120px 180px, 240px 90px;
        animation: twinkle 7s ease-in-out infinite alternate;
      }

      .sun {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff7bf 0%, var(--sun) 32%, #ffb703 80%);
        top: 70px;
        right: 90px;
        box-shadow: 0 0 30px rgba(255, 214, 102, 0.9), 0 0 80px rgba(255, 184, 0, 0.55);
        animation: sunPulse 4s ease-in-out infinite alternate;
      }

      .cloud {
        position: absolute;
        background: var(--cloud);
        border-radius: 999px;
        filter: drop-shadow(0 15px 8px rgba(0,0,0,0.15));
        animation: floatCloud 18s linear infinite;
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: var(--cloud);
        border-radius: 50%;
      }

      .cloud.one {
        width: 150px; height: 46px; top: 110px; left: 120px;
      }
      .cloud.one::before { width: 58px; height: 58px; left: 18px; bottom: 10px; }
      .cloud.one::after { width: 70px; height: 70px; right: 18px; bottom: 12px; }

      .cloud.two {
        width: 200px; height: 52px; top: 150px; left: 440px; animation-delay: 4s;
      }
      .cloud.two::before { width: 68px; height: 68px; left: 24px; bottom: 10px; }
      .cloud.two::after { width: 82px; height: 82px; right: 22px; bottom: 12px; }

      .cloud.three {
        width: 170px; height: 48px; top: 220px; right: 260px; animation-delay: 9s;
      }
      .cloud.three::before { width: 60px; height: 60px; left: 22px; bottom: 10px; }
      .cloud.three::after { width: 72px; height: 72px; right: 26px; bottom: 12px; }

      .mountains {
        position: absolute;
        left: 0; right: 0; bottom: 190px;
        height: 210px;
      }

      .mountains span {
        position: absolute;
        bottom: 0;
        background: linear-gradient(180deg, #6d8f98, #304c60);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      }

      .mountains .m1 { left: 0; width: 360px; height: 180px; }
      .mountains .m2 { left: 240px; width: 460px; height: 200px; }
      .mountains .m3 { right: 160px; width: 420px; height: 190px; }
      .mountains .m4 { right: 0; width: 300px; height: 170px; }

      .ground {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 230px;
        background: linear-gradient(180deg, var(--grass) 0%, #49b06a 25%, #3ca55c 100%);
      }

      .ground::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(0,0,0,0.08));
      }

      .path {
        position: absolute;
        left: 50%; bottom: 0;
        width: 280px; height: 170px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #cfa663, #b98d47 40%, #8b5e2a 100%);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        box-shadow: inset 0 0 30px rgba(0,0,0,0.14);
      }

      .house {
        position: absolute;
        left: 50%; bottom: 62px;
        width: 420px; height: 260px;
        transform: translateX(-50%);
        animation: houseBounce 3s ease-in-out infinite;
      }

      .roof {
        position: absolute;
        left: 25px; right: 25px; top: 10px;
        height: 120px;
        background: linear-gradient(180deg, var(--roof) 0%, var(--roof-dark) 100%);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        box-shadow: 0 18px 20px rgba(0,0,0,0.18);
      }

      .house-body {
        position: absolute;
        left: 42px; right: 42px; bottom: 0;
        height: 170px;
        background: linear-gradient(180deg, var(--house) 0%, #e8c08c 100%);
        border: 6px solid rgba(144, 89, 40, 0.5);
        border-bottom: none;
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -10px 20px rgba(255,255,255,0.2) inset;
      }

      .door {
        position: absolute;
        width: 68px; height: 120px;
        background: linear-gradient(180deg, #815222, #5b3417);
        border-radius: 18px 18px 0 0;
        left: 50%; bottom: 0;
        transform: translateX(-50%);
        box-shadow: inset 0 0 0 6px rgba(0,0,0,0.12);
      }

      .door::before {
        content: "";
        position: absolute;
        width: 10px; height: 10px;
        background: #ffd166;
        border-radius: 50%;
        right: 16px; top: 55px;
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.9);
      }

      .window-row {
        position: absolute;
        left: 60px; right: 60px; top: 52px;
        display: flex;
        justify-content: space-between;
      }

      .window {
        position: relative;
        width: 72px; height: 72px;
        background: linear-gradient(180deg, var(--window) 0%, #f5d76d 100%);
        border: 6px solid rgba(132, 91, 40, 0.7);
        border-radius: 8px;
        box-shadow: 0 0 18px var(--window-glow), inset 0 0 12px rgba(255,255,255,0.7);
      }

      .window::before,
      .window::after {
        content: "";
        position: absolute;
        background: rgba(124, 86, 42, 0.8);
      }

      .window::before { width: 6px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
      .window::after { height: 6px; width: 100%; left: 0; top: 50%; transform: translateY(-50%); }

      .chimney {
        position: absolute;
        width: 42px; height: 70px;
        background: linear-gradient(180deg, #b16a4a, #8a4d36);
        border-radius: 8px 8px 0 0;
        right: 98px; top: 0;
      }

      .tree {
        position: absolute;
        bottom: 90px;
        width: 110px;
        height: 200px;
        animation: sway 4.5s ease-in-out infinite;
      }

      .tree.left { left: 120px; }
      .tree.right { right: 120px; animation-delay: 1.2s; }

      .tree .trunk {
        position: absolute;
        width: 24px; height: 90px;
        left: 43px; bottom: 0;
        background: linear-gradient(180deg, var(--trunk), #5d3625);
        border-radius: 10px;
      }

      .tree .crown {
        position: absolute;
        left: 50%; bottom: 70px;
        width: 100px; height: 100px;
        transform: translateX(-50%);
        background: radial-gradient(circle at 30% 30%, #8fe2a0, var(--tree) 55%, #1f6f48 100%);
        border-radius: 50%;
        box-shadow:
          -26px 10px 0 -10px #49a86e,
          28px 12px 0 -12px #349562,
          0 25px 0 -12px #2e8a5a;
      }

      .flower {
        position: absolute;
        bottom: 48px;
        width: 12px; height: 12px;
        background: #ff7b7b;
        border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
        animation: bloom 2s ease-in-out infinite alternate;
      }

      .flower::before, .flower::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #ff9f7b;
      }

      .flower::before { transform: scale(0.6) translateY(-10px); }
      .flower::after { transform: scale(0.6) translateX(-10px); }

      .flower.f1 { left: 18%; }
      .flower.f2 { left: 28%; animation-delay: 0.5s; }
      .flower.f3 { left: 72%; animation-delay: 1s; }
      .flower.f4 { left: 81%; animation-delay: 0.7s; }

      .book-stack {
        position: absolute;
        left: 50%; bottom: 40px;
        width: 180px; height: 120px;
        transform: translateX(-50%);
      }

      .book {
        position: absolute;
        bottom: 0;
        height: 62px;
        border-radius: 8px 8px 0 0;
        box-shadow: 0 12px 18px rgba(0,0,0,0.12);
        animation: floatBook 3s ease-in-out infinite alternate;
      }

      .book:nth-child(1) {
        left: 0; width: 90px; background: linear-gradient(180deg, var(--book1), #df4d4d); animation-delay: 0.2s;
      }
      .book:nth-child(2) {
        left: 35px; width: 110px; background: linear-gradient(180deg, var(--book2), #efb941); animation-delay: 0.6s;
      }
      .book:nth-child(3) {
        left: 74px; width: 86px; background: linear-gradient(180deg, var(--book3), #37b8aa); animation-delay: 1s;
      }
      .book:nth-child(4) {
        left: 118px; width: 62px; background: linear-gradient(180deg, var(--book4), #364db8); animation-delay: 1.4s;
      }

      .subtitle {
        position: absolute;
        left: 50%; top: 28px;
        transform: translateX(-50%);
        text-align: center;
        color: #eaf6ff;
        text-shadow: 0 8px 18px rgba(0,0,0,0.25);
        z-index: 5;
      }

      .subtitle h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 4.25rem);
        letter-spacing: 3px;
        font-weight: 900;
        text-transform: uppercase;
        animation: textPop 2.6s ease-in-out infinite alternate;
      }

      .subtitle p {
        margin: 10px 0 0;
        font-size: clamp(0.8rem, 1.4vw, 1.2rem);
        letter-spacing: 5px;
        text-transform: uppercase;
        opacity: 0.9;
      }

      @keyframes twinkle {
        0% { opacity: 0.75; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.03); }
      }

      @keyframes sunPulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.08); }
      }

      @keyframes floatCloud {
        0% { transform: translateX(-12px); }
        50% { transform: translateX(18px); }
        100% { transform: translateX(-12px); }
      }

      @keyframes houseBounce {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(-8px); }
      }

      @keyframes sway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }

      @keyframes bloom {
        0% { transform: scale(0.9); }
        100% { transform: scale(1.15); }
      }

      @keyframes floatBook {
        0% { transform: translateY(0) rotate(-1deg); }
        100% { transform: translateY(-6px) rotate(1deg); }
      }

      @keyframes textPop {
        0% { transform: scale(1); }
        100% { transform: scale(1.04); }
      }

      @media (max-width: 820px) {
        .scene {
          height: 700px;
        }

        .house {
          transform: translateX(-50%) scale(0.82);
        }

        .tree.left { left: 32px; }
        .tree.right { right: 28px; }

        .cloud.one { left: 30px; }
        .cloud.two { left: 260px; }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="stars"></div>
      <div class="sun"></div>

      <div class="subtitle">
        <h1>Dream House</h1>
        <p>Home • Book • Tower • Life</p>
      </div>

      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div class="cloud three"></div>

      <div class="mountains">
        <span class="m1"></span>
        <span class="m2"></span>
        <span class="m3"></span>
        <span class="m4"></span>
      </div>

      <div class="tree left">
        <div class="crown"></div>
        <div class="trunk"></div>
      </div>

      <div class="tree right">
        <div class="crown"></div>
        <div class="trunk"></div>
      </div>

      <div class="house">
        <div class="chimney"></div>
        <div class="roof"></div>
        <div class="house-body">
          <div class="window-row">
            <div class="window"></div>
            <div class="window"></div>
          </div>
          <div class="door"></div>
        </div>
      </div>

      <div class="book-stack">
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
      </div>

      <div class="flower f1"></div>
      <div class="flower f2"></div>
      <div class="flower f3"></div>
      <div class="flower f4"></div>

      <div class="path"></div>
      <div class="ground"></div>
    </div>
  </body>
</html>
